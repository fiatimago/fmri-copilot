<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla del paciente — FMRI Assistant</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    #stage-image,
    #stage-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <div id="stage">
    <img id="stage-image" alt="" hidden>
    <!-- Silenciado: el audio sale de la ventana de control (mismo computador) -->
    <video id="stage-video" muted playsinline preload="auto" hidden></video>
  </div>

  <script src="js/video-cache.js"></script>
  <script src="js/pantalla.js"></script>
</body>

</html>
