<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva sesión — FMRI Assistant</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-brand">
                <img src="assets/logo.png" alt="Logo de FMRI Assistant" class="nav-logo">
                FMRI ASSISTANT
            </a>
            <a href="nueva-sesion.html" class="nav-link active">Nueva sesión</a>
            <a href="investigacion.html" class="nav-link">Investigación</a>
            <a href="guias.html" class="nav-link">Guías</a>
        </div>
    </nav>

    <section class="view">
        <div class="session-layout">

            <div class="panel player-panel">
                <div class="now-playing" id="now-playing" hidden>
                    <strong id="current-task-name">—</strong>
                    <span id="progress-label"></span>
                </div>

                <div class="player-section" id="player-container">
                    <div id="youtube-player"></div>

                    <div class="rest-screen" id="rest-screen" hidden>
                        <button id="btn-continue-next" class="btn-rest-next">Siguiente tarea</button>
                    </div>
                </div>

                <div class="task-nav-bar">
                    <button id="btn-prev-task" class="btn-secondary" disabled title="Tarea anterior">⏮ Anterior</button>
                    <button id="btn-next-task" class="btn-secondary" disabled title="Siguiente tarea">Siguiente
                        ⏭</button>
                </div>
            </div>

            <div class="panel builder-panel">
                <div class="settings-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-explainers" checked>
                        Videos explicativos
                    </label>

                    <div class="language-selector" id="language-selector">
                        <span class="language-label">Idioma:</span>
                        <button type="button" class="language-btn active" data-lang="es">Español</button>
                        <button type="button" class="language-btn" data-lang="en">English</button>
                    </div>

                    <div class="handedness-selector" id="handedness-selector">
                        <span class="handedness-label">Lateralidad:</span>
                        <button type="button" class="handedness-btn active" data-hand="diestro">Diestro</button>
                        <button type="button" class="handedness-btn" data-hand="zurdo">Zurdo</button>
                    </div>
                </div>

                <button id="btn-toggle-tasks" class="btn-secondary">Mostrar tareas disponibles</button>

                <div id="available-tasks-panel" class="tasks-dropdown" hidden>
                    <ul id="available-tasks-list" class="task-list"></ul>
                </div>

                <h3>Secuencia de la sesión</h3>
                <p class="sequence-total" id="sequence-total-duration"></p>
                <ol id="sequence-list" class="sequence-list"></ol>
                <p id="sequence-empty-hint" class="hint">Arrastra tareas aquí para armar la secuencia. La primera se
                    carga
                    automáticamente.</p>
            </div>

        </div>
    </section>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/session.js"></script>
</body>

</html>
