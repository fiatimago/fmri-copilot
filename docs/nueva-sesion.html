<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva sesión — fMRI Copilot</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="ns-page">

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="nav-brand">
                <img src="assets/logo.png" alt="Logo de fMRI Copilot" class="nav-logo">
                fMRI Copilot
            </a>
            <a href="nueva-sesion.html" class="nav-link active">Nueva sesión</a>
            <a href="investigacion.html" class="nav-link">Investigación</a>
            <a href="guias.html" class="nav-link">Guías</a>
        </div>
    </nav>

    <main class="ns-layout">

        <!-- ===== Columna izquierda: fija, sin scroll ===== -->
        <section class="ns-left panel">
            <div class="now-bar">
                <span class="now-label">AHORA</span>
                <strong id="now-title">Agrega una tarea para empezar</strong>
                <span id="now-detail"></span>
            </div>

            <div class="ns-player-area">
                <div class="ns-player-box">
                    <video id="video-player" controls playsinline preload="auto"></video>

                    <div class="rest-screen" id="rest-screen" hidden>
                        <button id="btn-continue-next" class="btn-rest-next">Siguiente tarea</button>
                        <button id="btn-start-task" class="btn-rest-next" hidden>Continuar a la tarea</button>
                    </div>
                </div>
            </div>

            <div class="ns-controls">
                <div class="ns-controls-group">
                    <button id="btn-prev-task" class="btn-secondary" disabled title="Tarea anterior">⏮ Anterior</button>
                    <button id="btn-pause-nav" class="btn-secondary btn-play" disabled
                        title="Pausar/reanudar el video actual (barra espaciadora)">▶</button>
                    <button id="btn-next-task" class="btn-secondary" disabled title="Siguiente tarea">Siguiente ⏭</button>
                </div>
                <button id="btn-open-presenter" class="btn-secondary"
                    title="Abre una ventana sin controles para proyectar al paciente">
                    🖥️ Pantalla del paciente <span id="presenter-state" class="presenter-state">no abierta</span>
                </button>
            </div>
        </section>

        <!-- ===== Columna derecha: la única con scroll ===== -->
        <aside class="ns-right">

            <details class="side-panel" id="panel-params" data-remember open>
                <summary>⚙ Parámetros <span id="params-summary" class="panel-summary"></span></summary>
                <div class="settings-row">
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggle-explainers" checked>
                        Videos explicativos
                    </label>

                    <div class="language-selector" id="language-selector">
                        <span class="language-label">Idioma:</span>
                        <button type="button" class="language-btn active" data-lang="es">Español</button>
                        <button type="button" class="language-btn" data-lang="en">English</button>
                    </div>

                    <div class="handedness-selector" id="handedness-selector">
                        <span class="handedness-label">Lateralidad:</span>
                        <button type="button" class="handedness-btn active" data-hand="diestro">Diestro</button>
                        <button type="button" class="handedness-btn" data-hand="zurdo">Zurdo</button>
                    </div>
                </div>
            </details>

            <details class="side-panel" id="panel-guion" data-remember open>
                <summary>📋 Guion</summary>
                <div class="guion-tabs">
                    <button type="button" class="guion-tab active" data-tab="entrevista">Entrevista</button>
                    <button type="button" class="guion-tab" data-tab="tarea">Tarea actual</button>
                </div>
                <div class="guion-body" id="guion-body"></div>
                <details class="sub-panel" id="panel-activaciones" data-remember hidden>
                    <summary>Activaciones esperadas</summary>
                    <div class="activaciones-body" id="activaciones-body"></div>
                </details>
            </details>

            <section class="side-panel sequence-panel">
                <div class="sequence-header">
                    <h3>Secuencia <span id="sequence-count"></span></h3>
                    <span class="sequence-total" id="sequence-total-duration"></span>
                </div>
                <ol id="sequence-list" class="sequence-list"></ol>
                <p id="sequence-empty-hint" class="hint">Agrega tareas con los botones de abajo (o arrástralas
                    aquí). Se pueden repetir; la primera se carga automáticamente.</p>
                <p class="hint" id="preload-status"></p>
                <div class="add-task-buttons" id="add-task-buttons"></div>
            </section>

            <button id="btn-download-report" class="btn-secondary" disabled>Descargar reporte de la sesión</button>
        </aside>

    </main>

    <script src="js/video-cache.js"></script>
    <script src="js/guion.js"></script>
    <script src="js/session.js"></script>
</body>

</html>
